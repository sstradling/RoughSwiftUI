name: Tests

# Runs on PRs targeting the default branch and on direct pushes to master.
# Also runs on Cursor cloud-agent working branches so PR checks light up
# before the PR is opened.
on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - 'cursor/**'

# Cancel any in-flight run for the same branch when a new commit lands.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Library schemes auto-generated by SwiftPM from Package.swift.
  SCHEME_BASE: RoughSwiftUI
  SCHEME_METAL: RoughSwiftUIMetal
  # Simulator selection: pin a device family and let `OS=latest` resolve to
  # whichever iOS runtime is preinstalled on the runner. Avoids brittle
  # UUID/version pinning that breaks whenever GitHub updates its image.
  IOS_DEVICE: 'iPhone 16 Pro'
  IOS_DESTINATION: 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'
  GENERIC_IOS_DESTINATION: 'generic/platform=iOS Simulator'

jobs:
  # ---------------------------------------------------------------------
  # Quick "does it still build for iOS?" gate. No simulator boot needed,
  # so this finishes in ~1–2 min and acts as a fast-failure signal.
  # Build both library schemes; either one breaking should fail the gate.
  # ---------------------------------------------------------------------
  build:
    name: Build (iOS)
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest installed Xcode
        run: |
          set -euo pipefail
          LATEST=$(ls -1 /Applications | grep -E '^Xcode_?[0-9]' | sort -V | tail -n1)
          echo "Selecting /Applications/${LATEST}"
          sudo xcode-select -s "/Applications/${LATEST}/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-build-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift', 'Sources/**/*.metal') }}
          restore-keys: deriveddata-build-${{ runner.os }}-

      - name: Resolve SwiftPM dependencies
        # Pre-resolves to populate the cache and surface manifest errors
        # before xcodebuild does the same work implicitly.
        run: swift package resolve

      - name: Build RoughSwiftUI
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme "$SCHEME_BASE" \
            -destination "$GENERIC_IOS_DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Build RoughSwiftUIMetal
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme "$SCHEME_METAL" \
            -destination "$GENERIC_IOS_DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

  # ---------------------------------------------------------------------
  # Full unit test run on an iOS simulator. Tests both library schemes
  # against the same booted simulator to amortize boot cost.
  # ---------------------------------------------------------------------
  test:
    name: Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest installed Xcode
        run: |
          set -euo pipefail
          LATEST=$(ls -1 /Applications | grep -E '^Xcode_?[0-9]' | sort -V | tail -n1)
          sudo xcode-select -s "/Applications/${LATEST}/Contents/Developer"
          xcodebuild -version

      - name: Show available simulator runtimes (diagnostic)
        run: xcrun simctl list runtimes

      - name: Cache SwiftPM dependencies and DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-test-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift', 'Sources/**/*.metal', 'Tests/**/*.swift') }}
          restore-keys: deriveddata-test-${{ runner.os }}-

      - name: Resolve SwiftPM dependencies
        run: swift package resolve

      - name: Pre-boot iOS simulator
        # Booting once up-front avoids each `xcodebuild test` invocation
        # paying its own boot cost. Uses `simctl bootstatus -b` to block
        # until the device finishes launching.
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j \
                 | jq -r --arg name "$IOS_DEVICE" \
                   '[.devices[][] | select(.name == $name and .isAvailable == true)][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No available simulator named '$IOS_DEVICE'"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Booting simulator $UDID ($IOS_DEVICE)"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Test RoughSwiftUI
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "$SCHEME_BASE" \
            -destination "$IOS_DESTINATION" \
            -resultBundlePath TestResults-Base.xcresult \
            -parallel-testing-enabled YES \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --report junit --output build/reports/base-junit.xml

      - name: Test RoughSwiftUIMetal
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "$SCHEME_METAL" \
            -destination "$IOS_DESTINATION" \
            -resultBundlePath TestResults-Metal.xcresult \
            -parallel-testing-enabled YES \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --report junit --output build/reports/metal-junit.xml

      - name: Upload xcresult bundles on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-bundles
          path: |
            TestResults-Base.xcresult
            TestResults-Metal.xcresult
          retention-days: 7

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: build/reports/*.xml
          retention-days: 7
