name: Tests

on:
  pull_request:
    branches: [master, main, dev]
  push:
    branches: [master, main, dev]

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Run Tests
        run: |
          set -euo pipefail
          # GitHub runners do not have a fixed simulator UUID. Prefer an
          # iPhone 16 Pro, then any available iPhone.
          DEVICE=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 16 Pro \(/ && $0 !~ /Max/ { print $2; exit }')
          if [ -z "${DEVICE}" ]; then
            DEVICE=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone \(/ && $0 !~ /Max/ { print $2; exit }')
          fi
          if [ -z "${DEVICE}" ]; then
            echo "No iPhone simulator runtime is installed."
            exit 1
          fi
          echo "Using simulator ${DEVICE}"
          xcodebuild test \
            -scheme RoughSwiftUI \
            -destination "platform=iOS Simulator,id=${DEVICE}" \
            -only-testing:RoughSwiftUITests \
            -parallel-testing-enabled NO
